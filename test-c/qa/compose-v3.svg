<g stroke="#867384" stroke-width="2">
 <path d="M54 655 L91 655 L96 690 L55 690Z" fill="#ae99a5"/>
 <path d="M80 655 L91 655 L96 690 L82 690Z" fill="#8e7c8e"/>
 <path d="M55 668 L92 668 M56 680 L94 680 M70 656 L71 668 M81 669 L82 680 M68 681 L69 690" fill="none"/>
 <path d="M51 652 Q63 647 75 651 Q86 648 94 652 L96 658 L52 658Z" fill="#fbf8ff" stroke="#d5cbdc"/>
 <path d="M41 816 L78 816 L83 833 L42 833Z" fill="#ae99a5"/>
 <path d="M67 816 L78 816 L83 833 L69 833Z" fill="#8e7c8e"/>
 <path d="M43 825 L81 825 M57 817 L58 825 M68 826 L69 833" fill="none"/>
 <path d="M38 813 Q50 810 62 813 Q73 810 81 813 L83 818 L39 818Z" fill="#fbf8ff" stroke="#d5cbdc"/>
</g>
<!-- Exactly two softened pairs. -->
<use xlink:href="#soft-routes" stroke="#d7d2e4" stroke-width="20" stroke-linecap="round"/>
<use xlink:href="#soft-routes" stroke="#bdb7ce" stroke-width="11" stroke-linecap="round"/>
<use xlink:href="#soft-routes" stroke="#d8d2e4" stroke-width="5" stroke-linecap="round"/>
<use xlink:href="#soft-routes" stroke="#e8e3f0" stroke-width="8" stroke-dasharray="13 36 8 52" stroke-linecap="round"/>
<!-- Exactly one sharp pair, with crisp tread. -->
<use xlink:href="#sharp-route" stroke="#7a7089" stroke-width="13" stroke-linecap="butt"/>
<use xlink:href="#sharp-route" stroke="#aaa0b6" stroke-width="8"/>
<use xlink:href="#sharp-route" stroke="#62576f" stroke-width="15" stroke-dasharray="4 9" stroke-linecap="butt"/>
<!-- Five numbered bays; bay 3 retains the same unmarked snow as the court. -->
<use xlink:href="#bay-board" x="200"/><use xlink:href="#bay-board" x="380"/><use xlink:href="#bay-board" x="560"/><use xlink:href="#bay-board" x="740"/><use xlink:href="#bay-board" x="920"/>
<g font-family="DejaVu Sans" font-size="36" font-weight="bold" text-anchor="middle" fill="#fffaf1"><text x="200" y="520">1</text><text x="380" y="520">2</text><text x="560" y="520">3</text><text x="740" y="520">4</text><text x="920" y="520">5</text></g>
<use xlink:href="#car" x="200" fill="#f1ce35"/><use xlink:href="#roof-snow" x="200"/>
<use xlink:href="#car" x="380" fill="#bd3e53"/><use xlink:href="#roof-snow" x="380"/>
<use xlink:href="#car" x="740" fill="#f1ce35"/>
<use xlink:href="#car" x="920" fill="#f1ce35"/><use xlink:href="#roof-snow" x="920"/>
<!-- The sole lamp stands just inside the upper gatepost, beside the common entrance lane. Its right edge faces the lane. -->
<g transform="translate(577,-58) scale(-1,1)">
<ellipse cx="470" cy="737" rx="28" ry="6" fill="#beb6ce"/>
<path d="M450 732 L490 732 L494 739 L446 739Z" fill="#716679"/>

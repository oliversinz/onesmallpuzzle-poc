<path d="M473 632 L477 694 M477 718 L477 730" stroke="#8d8299" stroke-width="4"/>
<!-- Transferred paint stays on the post: a horizontal band with scraped-through streaks beside the dent. -->
<path d="M460 700 L470 699 L481 700 L481 714 L471 714 L461 716 L461 712 L459 712 L460 707 L459 704Z" fill="#f1ce35"/>
<path d="M460 703 L471 703 M468 708 L481 708 M460 713 L469 713" fill="none" stroke="#51485e" stroke-width="2"/>
<path d="M465 697 L479 697 M466 718 L476 717" fill="none" stroke="#f1ce35" stroke-width="2"/>
<path d="M451 698 L458 708 L453 718" fill="none" stroke="#322a3c" stroke-width="3"/>
<path d="M444 626 L491 626 L487 581 L448 581Z" fill="#4e465b" stroke="#3f374b" stroke-width="2"/>
<path d="M451 588 L465 588 L465 618 L453 618Z M471 588 L483 588 L485 618 L471 618Z" fill="#c8d1df"/>
<path d="M439 582 L469 564 L497 582Z" fill="#64576e"/>
<path d="M440 579 L469 563 L496 579" fill="none" stroke="#f4f0fa" stroke-width="4" stroke-linejoin="round"/>
<path d="M469 557 L469 564" stroke="#4e465b" stroke-width="4" stroke-linecap="round"/>
</g>
<!-- The necessary public rules, with version 2's separate-pair condition. -->
<g font-family="DejaVu Sans" font-size="29" fill="#3e3349">
 <text x="56" y="867">It snowed from <tspan font-weight="bold">1 am</tspan> until <tspan font-weight="bold">3 am</tspan>, then stopped.</text>
 <g font-size="27">
  <text x="56" y="898">At <tspan font-weight="bold">2 am</tspan> the night porter heard a crunch: a car clipped the</text>
  <text x="56" y="926">lamp post by the entrance and left a smear of its paint on it.</text>
  <text x="56" y="954">That car is still in the car park.</text>
 </g>
 <text x="56" y="986">Every drive since 1 am left its <tspan font-weight="bold">own separate pair</tspan> of tyre tracks:</text>
 <text x="56" y="1020"><tspan font-weight="bold">softened</tspan> by fresh snow if made while it was snowing, <tspan font-weight="bold">sharp</tspan> if</text>
 <text x="56" y="1054">made after it stopped. Anything older is buried.</text>
</g>
</svg>
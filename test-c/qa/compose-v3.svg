</defs>
<image x="-4" y="-4" width="1088" height="1088" xlink:href="source-image.png"/>
<rect x="0" y="0" width="1080" height="197" fill="url(#sky-veil)"/>
<g fill="#3e3349" text-anchor="middle"><text x="540" y="76" font-family="URW Bookman,DejaVu Serif" font-size="54">A Crunch in the Snow</text><text x="540" y="127" font-family="DejaVu Sans" font-size="32">Which bay holds the car that hit the lamp post?</text></g>
<path d="M0 514 Q96 502 187 518 Q294 530 397 519 Q525 510 639 520 Q807 509 943 513 Q1019 504 1080 512 L1080 1080 L0 1080Z" fill="url(#snow)"/>
<!-- Sheltered veranda edge: the parked cars face the inn. -->
<path d="M100 513 L1005 513 L1010 539 L94 539Z" fill="#a894a0" stroke="#776775" stroke-width="2"/>
<path d="M94 539 L1010 539 L1009 551 L94 551Z" fill="#7f6b7b"/>
<path d="M103 518 L1004 518 M101 530 L1007 530" fill="none" stroke="#c2b0ba" stroke-width="2"/>
<!-- One gateway in the lower-left wall; the snow-covered lane continues off the left edge. -->
<path d="M0 680 L77 686 M0 830 L62 828 L1030 828 L1010 517 M92 517 L77 686" fill="none" stroke="#a99aae" stroke-width="18" stroke-linejoin="round"/>
<path d="M0 674 L76 680 M0 824 L61 822 L1029 822 L1009 511 M91 511 L76 680" fill="none" stroke="#fbf8ff" stroke-width="15" stroke-linejoin="round"/>

<g fill="#302f29">
  <text x="78" y="97" font-family="URW Bookman, DejaVu Serif" font-size="62"><tspan x="78" y="97">Which padlock isn't</tspan><tspan x="78" y="164">keeping things shut?</tspan></text>
  <text x="78" y="238" font-family="Ubuntu, DejaVu Sans" font-size="30"><tspan x="78" y="238">Drawers slide straight out; only the locks hold them shut.</tspan><tspan x="78" y="277">No unlocking, damage or dismantling. The frame is fixed.</tspan></text>
</g>
